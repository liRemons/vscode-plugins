<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Remons Markdown Editor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242840"/>
      <stop offset="0.55" stop-color="#1B1E2B"/>
      <stop offset="1" stop-color="#141622"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="384" y1="150" x2="384" y2="366">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#A06BFF"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#topGlow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Markdown 的 M -->
  <path d="M104 372 V158 L184 292 L264 158 V372" fill="none" stroke="#F7F9FF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 向下箭头 -->
  <path d="M384 150 V296" fill="none" stroke="url(#arrow)" stroke-width="46" stroke-linecap="round"/>
  <path d="M338 288 L384 366 L430 288 Z" fill="url(#arrow)" stroke-linejoin="round"/>
</svg>
